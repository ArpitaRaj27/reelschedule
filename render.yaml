# Render Blueprint: the whole production setup as code.
# Create it once in the Render Dashboard: New > Blueprint > pick this repo.
# Later pushes to main redeploy automatically, but only after the CI checks pass.
#
# One web service serves the React app AND the API from the same origin, so a single hostname
# can sit behind the CDN (Cloudflare) with a cache policy per content class (see README "Caching").

databases:
  - name: reelschedule-db
    plan: free                 # free Postgres expires 30 days after creation (fine for the term)
    region: ohio               # closest Render region to Chicago; must match the API
    postgresMajorVersion: "16"
    databaseName: reelschedule
    user: reelschedule
    ipAllowList: []            # no public access: only Render services on the private network

services:
  # ---------- App: API + React build, one origin ----------
  - type: web
    name: reelschedule-api-arpita
    runtime: node
    plan: free
    region: ohio
    branch: main
    autoDeployTrigger: checksPass
    buildCommand: npm ci --include=dev && npm run build -w web && npm run build -w api
    startCommand: npm run start -w api
    healthCheckPath: /healthz
    buildFilter:
      paths: ["api/**", "web/**", "package.json", "package-lock.json", "render.yaml"]
      ignoredPaths: ["api/test/**", "web/test/**"]
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: reelschedule-db
          property: connectionString
      # Exact origins allowed to call the API from a browser. The app is same-origin, so this only
      # matters for other front ends; add the custom domain here once it is live.
      - key: CORS_ORIGINS
        value: https://reelschedule-api-arpita.onrender.com
      - key: FESTIVAL_TIMEZONE
        value: America/Chicago
      - key: DEFAULT_BUFFER_MINUTES
        value: "15"
      # No shell on free instances, so the API migrates and loads the synthetic festival on startup.
      - key: RUN_MIGRATIONS
        value: "true"
      - key: SEED_DEMO_DATA
        value: "true"
      # Secret: paste your TMDB "API Read Access Token" in the Dashboard (never commit it).
      - key: TMDB_READ_TOKEN
        sync: false
      # Login (OIDC) settings from the course tenant are added in HW7. Until then the API is read-only.
